name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy SearchAudit Pro to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH (Docker + Paramiko)
        uses: docker://python:3.11-slim
        env:
          SERVER_HOST:         ${{ secrets.SERVER_HOST }}
          SERVER_USER:         ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD:     ${{ secrets.SERVER_PASSWORD }}
          NEXTAUTH_SECRET:     ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID:    ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          SERPAPI_KEY:         ${{ secrets.SERPAPI_KEY }}
          SUPERADMIN_EMAIL:    ${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
        with:
          entrypoint: /bin/bash
          args: /github/workspace/.github/scripts/run-deploy.sh
